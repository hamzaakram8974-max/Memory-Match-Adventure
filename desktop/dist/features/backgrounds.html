<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4FC3F7">
    <title>Backgrounds | Memory Match</title>
    <link rel="stylesheet" href="../memory-match.css">
    <link rel="stylesheet" href="features.css">
</head>
<body class="feature-page" data-feature="backgrounds">
    <main class="feature-shell">
        <header class="feature-header"><a class="feature-back" href="index.html">← Features</a><p class="feature-kicker">PERSONALIZE</p><h1>Backgrounds</h1><p>Tune your saved image or choose a new one from Settings.</p></header>
        <section class="feature-panel">
            <label class="feature-field" for="background-brightness">Image brightness <output id="brightness-value">88%</output><input id="background-brightness" type="range" min="0.4" max="1.2" step="0.05"></label>
            <label class="feature-field" for="background-blur">Image blur <output id="blur-value">0 px</output><input id="background-blur" type="range" min="0" max="8" step="1"></label>
            <label class="feature-field" for="background-position">Image position<select id="background-position"><option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option></select></label>
            <p class="feature-note">To select an image on your device, open the game → Settings → Theme, then choose and add a background image. Your image stays on this device.</p>
            <p id="background-status" class="feature-status" role="status"></p>
        </section>
    </main>
    <script type="module" src="features.js"></script>
</body>
</html>
